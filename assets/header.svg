<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Sadra Yousefi — Senior Backend Engineer and Technical Lead</title>
  <desc id="desc">A dark gradient banner with Sadra Yousefi's name and the phrase systems that scale, teams that ship.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b1a"/>
      <stop offset="0.52" stop-color="#171040"/>
      <stop offset="1" stop-color="#0b2742"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.52" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".5"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="1200" height="380" rx="28" fill="url(#bg)"/>
  <circle cx="1050" cy="60" r="230" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="110" cy="360" r="190" fill="#0284c7" opacity=".13" filter="url(#blur)"/>
  <g opacity=".16" stroke="#93c5fd">
    <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200"/>
    <path d="M90 0V380M210 0V380M330 0V380M450 0V380M570 0V380M690 0V380M810 0V380M930 0V380M1050 0V380M1170 0V380"/>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-width="2" opacity=".8">
    <circle cx="995" cy="190" r="82"/>
    <circle cx="995" cy="190" r="54"/>
    <path d="M913 190h164M995 108v164"/>
    <circle cx="995" cy="190" r="7" fill="#38bdf8" stroke="none"/>
    <circle cx="1050" cy="130" r="5" fill="#2dd4bf" stroke="none"/>
    <circle cx="938" cy="236" r="5" fill="#8b5cf6" stroke="none"/>
  </g>
  <rect x="72" y="62" width="208" height="34" rx="17" fill="#ffffff" opacity=".08"/>
  <circle cx="91" cy="79" r="5" fill="#2dd4bf"/>
  <text x="106" y="85" fill="#bfdbfe" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">BACKEND · LEADERSHIP</text>
  <text x="72" y="178" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">SADRA YOUSEFI</text>
  <rect x="72" y="205" width="510" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="72" y="260" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600">Senior Backend Engineer · Technical Lead</text>
  <text x="72" y="312" fill="#7dd3fc" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing=".5">SYSTEMS THAT SCALE  /  TEAMS THAT SHIP</text>
</svg>
